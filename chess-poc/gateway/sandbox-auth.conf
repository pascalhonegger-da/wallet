canton.parameters.non-standard-config = yes
# jwt-jwks: mock OAuth tokens, used only for the gateway's admin identity (participant_admin).
# party-jwt: players' self-issued tokens, signed with their own party key (Canton >= 3.6).
canton.participants.sandbox.ledger-api.auth-services = [
  { type = jwt-jwks, url = "http://127.0.0.1:8889/jwks", target-audience = "https://chess.local" },
  { type = party-jwt }
]
canton.participants.sandbox.ledger-api.max-token-lifetime = 60.minutes
